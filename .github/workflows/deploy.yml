name: Deploy upstream DzenAnalytics

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dzenanalytics-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/velios/dzenanalytics

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DEADover/DzenAnalytics
          ref: main
          persist-credentials: false

      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf 'VITE_OAUTH_PROVIDER_URL=https://token.zentable.ru\n' > .env.production
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f docker/Dockerfile -t "$IMAGE:$SOURCE_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SOURCE_SHA"
          docker push "$IMAGE:latest"

      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: dzenanalytics
          exclude-tags: latest
          keep-n-tagged: 3
          delete-untagged: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy via dokku
        env:
          SSH_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_PORT: ${{ secrets.DOKKU_SSH_PORT }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          dokku() { ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p "$DOKKU_PORT" "dokku@$DOKKU_HOST" -- "$@"; }
          dokku ps:stop dzenanalytics || true
          dokku git:from-image dzenanalytics "$IMAGE:$SOURCE_SHA"
